<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div
    class="wrapper footer-bar"
    style="
      display:flex;
      align-items:center;
      white-space:nowrap;
    "
  >
    <a class="rss-subscribe"
       href="{{ "/feed.xml" | relative_url }}"
       aria-label="RSS Feed">
        <svg class="svg-icon orange">
            <use xlink:href="/assets/minima-social-icons.svg#rss">
            </use>
        </svg>
      <span>Subscribe</span>
    </a>

    <div class="footer-meta" style="margin-left:auto; text-align:right;">
      &copy; {{ site.time | date: "%Y" }}
      {{ site.title | default: site.github.repository_owner }}.
      All rights reserved.
    </div>
  </div>

<script>
  (function () {
    function applyScheme() {
      var prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      var root  = document.documentElement;
      var body  = document.body;
      var card  = document.querySelector(".page-content");
      var title = document.querySelector(".site-title");
      var navLinks = document.querySelectorAll(".site-nav .page-link");

      if (prefersDark) {
        root.classList.add("dark-mode");

        // Softer dark background + text
        body.style.backgroundColor = "#141417";
        body.style.color = "#d3cec4";

        if (card) {
          card.style.backgroundColor = "#202127";
          card.style.color = "";
        }

        // Header title color (Praveen Prakash)
        if (title) {
          title.style.color = "#f0e1c4";
        }

        // Nav links color ("Know Me", etc.)
        navLinks.forEach(function (a) {
          a.style.color = "#e0d2b8";
        });

      } else {
        root.classList.remove("dark-mode");

        // Reset body/card
        body.style.backgroundColor = "";
        body.style.color = "";

        if (card) {
          card.style.backgroundColor = "";
          card.style.color = "";
        }

        // Reset header title & nav links to theme defaults
        if (title) {
          title.style.color = "";
        }

        navLinks.forEach(function (a) {
          a.style.color = "";
        });
      }
    }

    applyScheme();

    if (window.matchMedia) {
      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", applyScheme);
    }
  })();
</script>
</footer>

---
layout: nil
---

<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <title>
      {% if page.title %}
        {{ page.title }} | {{ site.title }}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    {%- seo -%}

    <!-- Remove any default favicon -->
    <link rel="shortcut icon" href="data:;base64,iVBORw0KGgo=">
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ '/assets/images/favicon.png' | relative_url }}"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

    {% if jekyll.environment == "production" %}
      <!-- Google Analytics -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-591NG132P2"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-591NG132P2');
      </script>
    {% endif %}
  </head>

  <body>
    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
          {{ site.title | escape }}
        </a>

        {% if site.pages %}
          <nav class="site-nav">
            <a class="page-link" href="{{ '/about/' | relative_url }}">Know Me</a>
          </nav>
        {% endif %}
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </body>
</html>

---
layout: nil
---

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      {% if page.title %}
        {{ page.title | escape }} · {{ site.title | escape }}
      {% else %}
        {{ site.title | escape }}
      {% endif %}
    </title>

    <!-- Favicon light/dark -->
    <link rel="icon" type="image/png"
          href="{{ '/assets/images/favicon_light.png' | relative_url }}"
          media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png"
          href="{{ '/assets/images/favicon_dark.png' | relative_url }}"
          media="(prefers-color-scheme: dark)">

    <!-- Minima styles -->
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

    <!-- Feed -->
    {% if site.feed %}
      {% feed_meta %}
    {% endif %}

  </head>

  <body>

    <!-- Header -->
    {% include header.html %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <!-- Footer -->
    {% include footer.html %}

  </body>
</html>

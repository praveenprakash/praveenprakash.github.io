---
layout: default
---

<ul class="posts">
  {% for post in site.posts limit: 10 %}
    <li class="post-item">
      <h2 class="post-title">{{ post.title }}</h2>  <!-- just text, not a link -->
      <p class="post-meta">{{ post.date | date_to_string }}</p>

      <div class="post-content">
        {{ post.content }}
      </div>
    </li>
  {% endfor %}
</ul>

<div class="infinite-spinner"></div>
